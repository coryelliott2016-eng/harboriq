name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Security Core Prompt v1.0, H-5 fix: static secret scanning across full
  # history diffs on every push/PR, gating the rest of the pipeline.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      # `ruff.lint.select` in pyproject.toml includes "S" (bandit-derived
      # security rules) on top of the previous pyflakes/pycodestyle-only
      # set -- this now doubles as this repo's lightweight SAST gate.
      # `scripts` added 2026-08-15: operator/provisioning scripts previously
      # had zero lint or SAST coverage (found during launch-audit Phase 2).
      - run: ruff check app tests scripts

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harboriq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d harboriq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Phase 16 — the Redis-backed rate limiter (app/core/rate_limit.py) and
      # the Celery broker/backend (app/core/celery_app.py) both need a real
      # Redis to talk to; tests/test_rate_limit_redis.py and
      # tests/test_celery_outbox_tasks.py exercise it directly. Mirrors the
      # `postgres` service container above: a plain image + a healthcheck
      # gate, published to the runner's localhost so the app's default
      # `redis://localhost:6379/0` needs no override here.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://harboriq_app:harboriq_app_pass@localhost:5432/harboriq
      SERVICE_DATABASE_URL: postgresql+psycopg://harboriq_service:harboriq_service_pass@localhost:5432/harboriq
      REDIS_URL: redis://localhost:6379/0
      # Backup / restore rehearsal gate (tests/test_backup_restore_rehearsal.py):
      # a superuser URL pointed at the maintenance `postgres` database so
      # the rehearsal script can CREATE / DROP its own scratch database.
      # Not the same as SERVICE_DATABASE_URL above (which points at the
      # `harboriq` app database and is a role without CREATEDB).
      REHEARSAL_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install psql + create roles
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f docker-entrypoint-initdb.d/00_roles.sql
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/harboriq
      - run: pip install -e ".[dev]"
      - name: Verify Redis is reachable
        run: |
          sudo apt-get install -y redis-tools
          redis-cli -h localhost -p 6379 ping
      - name: Apply migrations (service role)
        run: alembic upgrade head
      - name: Run tests
        run: pytest -ra
      # Security Core Prompt v1.0, H-5 fix: blocking dependency-CVE gate.
      # Was previously `pip-audit || true` (advisory-only, never failed the
      # build). A genuine no-fix-available CVE should be triaged into an
      # explicit, reviewed `pip-audit --ignore-vuln <ID>` exception with a
      # comment here -- not silenced wholesale.
      - name: Dependency audit (blocking)
        run: |
          # Upgrade pip first so the audit never fails on the runner image's
          # own bundled pip (e.g. PYSEC-2026-196 in pip <26.1.2) rather than
          # on a real project dependency.
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      # `--legacy-peer-deps` is required until eslint-plugin-jsx-a11y ships a
      # release with an eslint v10 peer range. Its 6.10.2 declares
      # `eslint@^3 || ... || ^9` (see the plugin's CHANGELOG, no v10
      # support tag yet), and this project is on eslint@^10.8.0, so a
      # strict `npm ci` refuses to install with ERESOLVE. The plugin does
      # work with eslint v10 at runtime; the peer range is stale. Revisit
      # this flag when jsx-a11y publishes a version that declares eslint
      # v10 support in its peers and remove it.
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      # Security Core Prompt v1.0, H-5 fix: blocking dependency-CVE gate.
      # Was previously `npm audit --audit-level=high || true`
      # (advisory-only). audit-ci reads frontend/audit-ci.jsonc, which fails
      # the build on any unreviewed moderate+ advisory; only advisories
      # explicitly allowlisted there (each with a written justification and
      # a review-by date) are permitted through.
      - name: Dependency audit (blocking)
        run: npm run audit:ci

  docker-build:
    # Real verification of the Dockerfile changes: this sandbox that authored
    # them has no Docker daemon at all, so GitHub's ubuntu-latest runner
    # (which does have Docker preinstalled) is the *first* place either
    # image actually gets built. Gated behind lint/test/frontend so a broken
    # Dockerfile never masks a simpler, faster-to-diagnose app-level failure.
    needs: [secret-scan, lint, test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build backend image
        run: docker build -t harboriq-backend:ci .
      - name: Build frontend image
        run: docker build -t harboriq-frontend:ci frontend
