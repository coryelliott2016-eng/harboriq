name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harboriq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d harboriq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Phase 16 — the Redis-backed rate limiter (app/core/rate_limit.py) and
      # the Celery broker/backend (app/core/celery_app.py) both need a real
      # Redis to talk to; tests/test_rate_limit_redis.py and
      # tests/test_celery_outbox_tasks.py exercise it directly. Mirrors the
      # `postgres` service container above: a plain image + a healthcheck
      # gate, published to the runner's localhost so the app's default
      # `redis://localhost:6379/0` needs no override here.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://harboriq_app:harboriq_app_pass@localhost:5432/harboriq
      SERVICE_DATABASE_URL: postgresql+psycopg://harboriq_service:harboriq_service_pass@localhost:5432/harboriq
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psql + create roles
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f docker-entrypoint-initdb.d/00_roles.sql
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/harboriq
      - run: pip install -e ".[dev]"
      - name: Verify Redis is reachable
        run: |
          sudo apt-get install -y redis-tools
          redis-cli -h localhost -p 6379 ping
      - name: Apply migrations (service role)
        run: alembic upgrade head
      - name: Run tests
        run: pytest -ra
      # Advisory only, not gating: pip-audit flags known CVEs in installed
      # packages, including transitive dependencies this repo does not
      # control the release cadence of. Failing the whole build on a CVE
      # with no upstream fix yet would block every future merge until some
      # third party ships a patch -- `|| true` keeps this a visible signal
      # in the log without being a hard gate. Revisit once there is a
      # process for triaging/allowlisting specific advisories.
      - name: Dependency audit (advisory, non-blocking)
        run: |
          pip install pip-audit
          pip-audit || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test
      # Advisory only, same reasoning as the backend's pip-audit step above:
      # a transitive npm CVE with no available fix must not block merges.
      - name: Dependency audit (advisory, non-blocking)
        run: npm audit --audit-level=high || true

  docker-build:
    # Real verification of the Dockerfile changes: this sandbox that authored
    # them has no Docker daemon at all, so GitHub's ubuntu-latest runner
    # (which does have Docker preinstalled) is the *first* place either
    # image actually gets built. Gated behind lint/test/frontend so a broken
    # Dockerfile never masks a simpler, faster-to-diagnose app-level failure.
    needs: [lint, test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t harboriq-backend:ci .
      - name: Build frontend image
        run: docker build -t harboriq-frontend:ci frontend
