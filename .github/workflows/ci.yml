name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: harboriq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d harboriq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://harboriq_app:harboriq_app_pass@localhost:5432/harboriq
      SERVICE_DATABASE_URL: postgresql+psycopg://harboriq_service:harboriq_service_pass@localhost:5432/harboriq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install psql + create roles
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$POSTGRES_URL" -v ON_ERROR_STOP=1 -f docker-entrypoint-initdb.d/00_roles.sql
        env:
          POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/harboriq
      - run: pip install -e ".[dev]"
      - name: Apply migrations (service role)
        run: alembic upgrade head
      - name: Run tests
        run: pytest -ra
