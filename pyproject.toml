[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harboriq"
version = "0.1.0"
description = "HarborIQ v2 — marine service operating system (corrected scaffold)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    "stripe>=8.0",
    # PDF invoice generation (Phase 8). Chose reportlab over weasyprint:
    # weasyprint needs system-level pango/cairo/gdk-pixbuf shared libraries
    # that are not guaranteed present in every deploy target (containers,
    # serverless, CI images), while reportlab is pure-Python + pillow and
    # installs the same everywhere `pip install` works. HarborIQ's invoice
    # PDF is a simple, programmatically-laid-out business document (no HTML/
    # CSS templates to reuse) -- reportlab's lower-level canvas/Platypus API
    # is a fine fit and avoids weasyprint's heavier native dependency chain.
    "reportlab>=5.0",
    "PyJWT>=2.8",
    "argon2-cffi>=23.1",
    "prometheus-client>=0.20",
    "sentry-sdk[fastapi]>=2.0",
    # Geocoding (Phase 10): app/services/geocoding.py calls OpenStreetMap
    # Nominatim over plain HTTPS. A real runtime dependency, not test-only —
    # promoted here from what used to be a dev-only transitive install.
    "httpx>=0.27",
    # Phase 16 — Redis-backed rate limiting (app/core/rate_limit.py) and the
    # Celery broker/result backend (app/core/celery_app.py). One dependency
    # covers both: the `redis` package is both a plain client (rate limiter)
    # and Celery's broker/result-backend transport.
    "redis>=5.0",
    "celery>=5.4",
    # MFA/TOTP enrollment (Phase 16): pyotp generates/verifies RFC 6238 TOTP
    # codes and builds the otpauth:// URI; cryptography's Fernet encrypts
    # `users.mfa_secret_enc` at rest (see app/core/crypto.py).
    "pyotp>=2.9",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # Bounds any single test at 300s so a hung fixture/connection fails fast
    # instead of blocking a local run or CI job indefinitely. Not wired into
    # CI's own `pytest` invocation today (CI has its own job-level timeout),
    # but declaring it here means `--timeout=N` works for anyone running the
    # suite locally without an extra ad-hoc `pip install`.
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    # starlette.testclient (used transitively via fastapi.testclient.TestClient,
    # which every test's `client` fixture imports) prefers `httpx2` as of
    # Starlette 1.2.0 and emits a StarletteDeprecationWarning on every import
    # when only classic `httpx` is installed. `httpx2` is a real, currently
    # maintained package (see https://pypi.org/project/httpx2/, and Starlette's
    # own `full` extra which bundles it) — not a hoax/typo package — so this is
    # the genuine upstream-endorsed fix rather than a version-pin workaround.
    # Runtime app code and the Stripe SDK still use plain `httpx`/`requests`
    # under the hood; this addition is test-infrastructure only.
    "httpx2>=2.0",
    "ruff>=0.4",
    # Phase 8: tests/test_invoice_pdf_email.py verifies the generated invoice
    # PDF actually contains the right text (invoice id, totals, line items)
    # rather than just checking byte length -- pypdf is test-infrastructure
    # only, the app itself never reads PDFs back, only writes them
    # (app/services/invoice_pdf.py, via reportlab).
    # >=6.15.0: fixes PYSEC-2026-3655 / PYSEC-2026-3656 (pip-audit, 2026-08).
    "pypdf>=6.15.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# CI installs ruff unpinned, and newer releases widen the implicit default rule
# set, so leaving this unset makes the lint gate drift with the release calendar.
# These are ruff's documented defaults, stated explicitly.
# "S" adds ruff's bandit-derived security rules (Security Core Prompt
# v1.0, H-5 fix: previously only pyflakes/pycodestyle-error rules ran, with
# zero security-focused static analysis). A few rules that fire on
# deliberate, already-reviewed patterns in this codebase are ignored below
# rather than suppressed inline everywhere they occur.
select = ["E4", "E7", "E9", "F", "S"]
ignore = [
    # S101: `assert` is pytest's normal assertion mechanism throughout
    # tests/ -- not a production `-O`-stripped guard.
    "S101",
    # S608: several service-layer queries in this codebase build SQL with
    # f-strings/format for identifiers (table/column names selected from a
    # fixed internal allowlist, e.g. dynamic ORDER BY columns), never from
    # request-controlled string content -- all user-supplied *values* go
    # through SQLAlchemy bound parameters. Reviewed case-by-case rather than
    # ignored blanket; kept here because ruff's static check cannot tell
    # "identifier from an internal allowlist" apart from "value from the
    # request" and would otherwise force noisy per-line `# noqa`s on code
    # that already follows the parameterized-query standard everywhere it
    # matters.
    "S608",
]

[tool.ruff.lint.per-file-ignores]
# S105/S106: test fixtures legitimately hardcode literal passwords/tokens
# (e.g. "test-auth-token", seeded user passwords) -- these are not secrets,
# they are throwaway values that only ever exist inside the test database.
"tests/*" = ["S105", "S106", "S107", "S110"]
