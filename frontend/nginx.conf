server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline HTTP security headers (Security Core Prompt v1.0, H-3 fix;
    # OWASP ASVS V14). `add_header` on a `server` block applies to every
    # `location` (including the SPA fallback below) unless a location
    # re-declares `add_header` itself, which would otherwise reset this
    # list per nginx's inheritance rules — there is only one location here,
    # so that pitfall does not apply, but keep it in mind if a new location
    # (e.g. for `/health`) is ever added.
    #
    # connect-src allows any HTTPS/WSS origin rather than a single hardcoded
    # API host: VITE_API_URL is a build-time value baked into the bundled JS
    # per-deployment (see frontend/.env.example), not something this static
    # nginx config can see, so it cannot be pinned here without duplicating
    # that value into a second place that could silently drift out of sync.
    # Tightening this to the exact API origin is straightforward once nginx
    # config generation is templated from the same deployment env as the
    # frontend build (tracked as a follow-up, not done here to avoid a
    # config that silently breaks API calls on the next environment).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # React Router uses client-side routing (BrowserRouter), so any path
    # that isn't a real static file must fall back to index.html and let
    # the client router resolve it — otherwise a hard refresh on e.g.
    # /jobs/<id> or /pay/<token> 404s at the web server.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
